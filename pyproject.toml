[project]
name = "rime-orchestrator"
version = "0.1.0"
description = "Realtime voice-agent orchestration engine with request fencing and interruption recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

# pytest configuration lives in pytest.ini at the repo root, so the agent
# suite and the orchestrator suite run under one config instead of two that
# disagree (this section used to set asyncio_mode/testpaths for backend only).

[tool.ruff]
line-length = 100
target-version = "py311"
