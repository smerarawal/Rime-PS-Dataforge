[pytest]
# One pytest config for the whole repo. Both suites run from the root:
#   * the LiveKit agent suite   (test_*.py at the top level)
#   * the orchestrator suite    (backend/tests)
#
# asyncio_mode = auto is required by backend/tests, which were written
# without explicit @pytest.mark.asyncio markers. The agent suite's explicit
# markers remain valid under auto, so one mode serves both.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = .
python_files = test_*.py
